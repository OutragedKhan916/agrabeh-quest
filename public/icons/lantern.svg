<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 0 34 60">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8741a"/>
      <stop offset=".45" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#c8841e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".6">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset=".45" stop-color="#ffb938"/>
      <stop offset="1" stop-color="#d96a12"/>
    </radialGradient>
  </defs>

  <!-- hanging ring -->
  <circle cx="32" cy="4.5" r="3" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
  <rect x="31" y="7" width="2" height="3" fill="url(#gold)"/>

  <!-- onion dome -->
  <path d="M32 9.5c-2 3-8.5 5.5-11 10.5h22c-2.5-5-9-7.5-11-10.5z" fill="url(#gold)"/>
  <circle cx="32" cy="9.5" r="1.6" fill="#ffd76a"/>
  <rect x="18" y="20" width="28" height="3" rx="1" fill="url(#gold)"/>

  <!-- glass body with warm light -->
  <path d="M20 23h24l-2 23H22z" fill="url(#glow)"/>

  <!-- arched window frames -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M20 23h24l-2 23H22z"/>
    <path d="M27.3 23v23M36.7 23v23"/>
    <path d="M21.6 44V31c0-3.5 2.8-5.5 5.7-5.5M42.4 44V31c0-3.5-2.8-5.5-5.7-5.5"/>
    <path d="M27.3 31c0-3.5 2.1-5.5 4.7-5.5s4.7 2 4.7 5.5"/>
  </g>
  <!-- star cut-out pattern -->
  <path d="M32 33.5l1.2 2.6 2.8.3-2.1 1.9.6 2.8-2.5-1.4-2.5 1.4.6-2.8-2.1-1.9 2.8-.3z" fill="#fff6c8" opacity=".9"/>

  <!-- base -->
  <rect x="19" y="46" width="26" height="3" rx="1" fill="url(#gold)"/>
  <path d="M23 49h18l-3 5H26z" fill="url(#gold)"/>
  <circle cx="32" cy="57" r="2.2" fill="url(#gold)"/>
</svg>
