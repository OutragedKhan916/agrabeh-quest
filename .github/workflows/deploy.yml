# Publishes the game to GitHub Pages on every push.
# Requires: Settings → Pages → Source = "GitHub Actions".
# (If Source is "Deploy from a branch" instead, the site still works:
#  GitHub serves the files at the top of the repo directly.)
name: Publish to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check items.json + make QR code PNGs
        run: npm run build

      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html game.js style.css items.json qrcodes.html icons qr .nojekyll _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
